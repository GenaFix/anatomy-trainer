
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Anatomy Trainer 1.2</title>
<style>
:root{
 --bg:#0b1425;--card:#152640;--panel:#0c1a30;
 --border:#345078;--text:#eaf2ff;--muted:#a8bfdc;
 --green:#46e4ad;--blue:#38bdf8
}
*{box-sizing:border-box}
body{
 margin:0;background:var(--bg);color:var(--text);
 font-family:Arial,Helvetica,sans-serif
}
main{max-width:960px;margin:auto;padding:18px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px}
h1{font-size:25px;margin:8px 0}
small{color:var(--muted)}
.card{
 background:var(--card);border:1px solid var(--border);
 border-radius:18px;padding:20px;margin-top:18px
}
.controls{display:flex;flex-wrap:wrap;justify-content:center;gap:9px}
select,button{
 background:#263f64;border:1px solid #5877a3;color:white;
 border-radius:10px;padding:12px;font-size:15px;cursor:pointer
}
select{max-width:100%}
button:hover{background:#365a89}
button:disabled{opacity:.65;cursor:default}
.top{display:flex;justify-content:space-between;gap:10px;margin-top:18px;color:#c6d9f2}
.bar{height:9px;background:#354763;border-radius:10px;overflow:hidden;margin:15px 0}
#progress{height:100%;background:#39c5e8;width:0;transition:.3s}
.stage{
 background:var(--panel);border-radius:14px;
 padding:10px;margin:15px 0;text-align:center
}
svg{width:100%;max-width:530px;height:340px;display:block;margin:auto}
#visualTitle{font-size:13px;color:var(--muted);margin:6px}
#visualNote{font-size:13px;color:var(--muted);min-height:22px}
#question{font-size:21px;line-height:1.45}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:15px}
.answers button{text-align:left;min-height:55px}
.correct{background:#176b50!important;border-color:#4ade80!important}
.wrong{background:#843944!important;border-color:#ff8181!important}
#feedback{margin-top:15px;line-height:1.6}
#next{background:#167ca5;margin-top:15px;width:100%}
.hidden{display:none!important}
.note{font-size:13px;color:var(--muted);line-height:1.5}
#results{display:none}
@media(max-width:550px){
 main{padding:10px}
 .card{padding:12px}
 .answers{grid-template-columns:1fr}
 svg{height:285px}
 h1{font-size:21px}
 #question{font-size:19px}
}
</style>
</head>
<body>
<main>
<header>
<div>
<h1>🦴 Anatomy Trainer <small>1.2</small></h1>
<small>Анатомические направления, движения и биомеханика</small>
</div>
<button onclick="restart()" title="Начать заново">↻</button>
</header>

<section class="card">
<div class="controls">
<select id="category" onchange="restart()">
<option value="all">Все категории</option>
<option value="directions">Направления</option>
<option value="movements">Движения суставов</option>
<option value="planes">Анатомические плоскости</option>
<option value="advanced">Составные направления</option>
</select>
<select id="mode" onchange="restart()">
<option value="visual">Угадай по изображению</option>
<option value="text">Вопросы по определениям</option>
</select>
</div>

<div class="top">
<span id="counter"></span>
<span id="score"></span>
</div>
<div class="bar"><div id="progress"></div></div>

<div class="stage">
<div id="visualTitle">АНАТОМИЧЕСКАЯ ВИЗУАЛИЗАЦИЯ</div>
<svg id="drawing" viewBox="0 0 440 320"
 role="img" aria-label="Анатомическая учебная схема"></svg>
<div id="visualNote"></div>
</div>

<small id="topic"></small>
<h2 id="question"></h2>
<div id="answers" class="answers"></div>
<div id="feedback"></div>
<button id="next" class="hidden" onclick="nextQuestion()">Следующий вопрос →</button>
</section>

<section class="card" id="results"></section>
<p class="note">
Учебные схемы упрощены и не заменяют анатомический атлас.
Анимации автоматически повторяются. Результаты сохраняются
локально в браузере.
</p>
</main>

<script>

{cat:"advanced",term:"Вентрокаудомедиально",type:"vector",v:[-1,-1,-1],
q:"Как описать направление вектора тремя компонентами?",
opts:["Дорзокраниолатерально","Вентрокаудомедиально","Вентрокраниолатерально","Дорзокаудолатерально"],

let pool=[],index=0,correct=0,locked=false;
let animation=null;
let stats;
try{
 stats=JSON.parse(localStorage.getItem("anatomyStats12")||"null");
}catch(e){stats=null}
if(!stats||typeof stats.done!=="number"){
 stats={done:0,correct:0};
}

function el(tag,attrs={},parent=$("drawing")){
 const e=document.createElementNS(NS,tag);
 Object.entries(attrs).forEach(([k,v])=>e.setAttribute(k,v));
 parent.appendChild(e);
 return e;
}
function line(x1,y1,x2,y2,color="#c4d9ff",w=6,parent){
 return el("line",{
  x1,y1,x2,y2,stroke:color,"stroke-width":w,
  "stroke-linecap":"round"
 },parent||$("drawing"));
}
function circle(x,y,r,color="#c4d9ff",parent){
 return el("circle",{
  cx:x,cy:y,r,fill:"none",stroke:color,"stroke-width":4
 },parent||$("drawing"));
}
function text(x,y,value,size=13){
 const e=el("text",{
  x,y,fill:"#b6cbe6","font-size":size,
  "text-anchor":"middle"
 });
 e.textContent=value;
 return e;
}
function path(d,color="#46e4ad",w=3,dash=""){
 return el("path",{
  d,stroke:color,"stroke-width":w,fill:"none",
  "stroke-linecap":"round","stroke-linejoin":"round",
  ...(dash?{"stroke-dasharray":dash}:{})
 });
}
function arrow(x1,y1,x2,y2,color="#46e4ad"){
 line(x1,y1,x2,y2,color,5);
 const a=Math.atan2(y2-y1,x2-x1),s=13;
 line(x2,y2,x2-s*Math.cos(a-.52),y2-s*Math.sin(a-.52),color,5);
 line(x2,y2,x2-s*Math.cos(a+.52),y2-s*Math.sin(a+.52),color,5);
}
function head(x,y,view="front",scale=1){
 const g=el("g",{transform:`translate(${x} ${y}) scale(${scale})`});
 el("ellipse",{cx:0,cy:0,rx:19,ry:24,
  fill:"#243e60",stroke:"#c4d9ff","stroke-width":3},g);
 if(view==="front"){
  circle(-7,-3,1.8,"#c4d9ff",g);
  circle(7,-3,1.8,"#c4d9ff",g);
  line(0,0,0,7,"#c4d9ff",2,g);
  el("path",{d:"M-7 13 Q0 18 7 13",
   stroke:"#c4d9ff","stroke-width":2,fill:"none"},g);
  circle(-19,4,4,"#c4d9ff",g);
  circle(19,4,4,"#c4d9ff",g);
 }else if(view==="side"){
  el("path",{d:"M-18 -4 L-27 4 L-18 9",
   stroke:"#c4d9ff","stroke-width":2,fill:"none"},g);
  circle(8,3,5,"#c4d9ff",g);
  circle(-12,-4,1.5,"#c4d9ff",g);
 }else{
  el("path",{d:"M-16 -8 Q0 -22 16 -8",
   stroke:"#c4d9ff","stroke-width":3,fill:"none"},g);
 }
 return g;
}
function person(view="front",cx=200,cy=46){
 head(cx,cy,view);
 line(cx,cy+25,cx,cy+145,"#c4d9ff",9);
 line(cx,cy+52,cx-45,cy+98);
 line(cx,cy+52,cx+45,cy+98);
 line(cx,cy+145,cx-35,cy+235);
 line(cx,cy+145,cx+35,cy+235);
 circle(cx,cy+52,5);
 circle(cx-45,cy+98,4);
 circle(cx+45,cy+98,4);
}
function stop(){
 if(animation!==null)cancelAnimationFrame(animation);
 animation=null;
}
function clear(){
 stop();
 $("drawing").innerHTML="";
}
function cycle(draw){
 const start=performance.now();
 function frame(now){
  const p=((now-start)%3200)/3200;
  // Active movement, short hold, return, short hold.
  let t;
  if(p<.40)t=p/.40;
  else if(p<.55)t=1;
  else if(p<.88)t=1-(p-.55)/.33;
  else t=0;
  t=t*t*(3-2*t);
  draw(t);
  animation=requestAnimationFrame(frame);
 }
 animation=requestAnimationFrame(frame);
}
function staticDrawing(q){
 clear();
 if(q.type==="arrow"){
  person();
  const c={
   up:[290,220,290,85],
   down:[290,85,290,220],
   right:[200,145,330,145],
   left:[330,145,200,145]
  };
  arrow(...c[q.v]);
  text(210,305,"Вид спереди");
 }
 if(q.type==="limb"){
  head(95,62,"front");
  line(95,88,95,208,"#c4d9ff",9);
  line(95,112,195,150);
  line(195,150,305,198);
  circle(195,150,5);
  const a=q.v==="prox";
  arrow(a?294:205,a?194:154,a?207:294,a?154:194);
  text(215,270,"Направление вдоль конечности");
 }
 if(q.type==="side"){
  person("side",185,45);
  // In profile the face is to the left.
  arrow(q.v==="front"?300:100,155,q.v==="front"?105:300,155);
  text(220,305,"Профиль: лицо слева");
 }
 if(q.type==="plane"){
  drawPlane(q.v,0);
 }
 if(q.type==="vector"){
  drawVector(q.v,0);
 }
}
function drawPlane(kind,t){
 $("drawing").innerHTML="";
 // Isometric representation of an anatomical reference box.
 const x=220,y=165;
 const p=(dx,dy,dz)=>{
  const angle=t*.20;
  const X=dx*Math.cos(angle)-dz*Math.sin(angle);
  const Z=dx*Math.sin(angle)+dz*Math.cos(angle);
  return [x+X*.9+Z*.48,y-dy*.9-Z*.35];
 };
 function polygon(points,fill,stroke){
  el("polygon",{points:points.map(v=>v.join(",")).join(" "),
   fill,stroke,"stroke-width":2,"fill-opacity":.32});
 }
 // Reference vertical body axis.
 line(220,55,220,272,"#c4d9ff",7);
 head(220,40,"front",.65);
 line(220,110,185,145);
 line(220,110,255,145);
 line(220,272,190,303);
 line(220,272,250,303);
 let pts;
 if(kind==="sag"){
  pts=[p(0,-120,-70),p(0,-120,70),
       p(0,120,70),p(0,120,-70)];
  polygon(pts,"#38bdf8","#38bdf8");
 }
 if(kind==="front"){
  pts=[p(-90,-120,0),p(90,-120,0),
       p(90,120,0),p(-90,120,0)];
  polygon(pts,"#46e4ad","#46e4ad");
 }
 if(kind==="trans"){
  pts=[p(-90,0,-70),p(90,0,-70),
       p(90,0,70),p(-90,0,70)];
  polygon(pts,"#f6b95b","#f6b95b");
 }
 text(220,314,"Условная объёмная схема");
}
function drawVector(v,t){
 $("drawing").innerHTML="";
 const origin=[205,205];
 // x = cranial, y = lateral, z = dorsal.
 // Oblique projection: dorsal points upper-right.
 const project=(c,l,d)=>[
  origin[0]+l*88+d*58,
  origin[1]-c*88-d*34
 ];
 const axes=[
  [[0,0,0],[1,0,0],"Краниально"],
  [[0,0,0],[0,1,0],"Латерально"],
  [[0,0,0],[0,0,1],"Дорзально"]
 ];
 axes.forEach(([a,b,name])=>{
  const A=project(...a),B=project(...b);
  line(A[0],A[1],B[0],B[1],"#55718e",2);
  text(B[0],B[1]-8,name,11);
 });
 circle(...origin,5);
 const end=project(v[0],v[1],v[2]);
 const f=.12+.88*t;
 arrow(origin[0],origin[1],
  origin[0]+(end[0]-origin[0])*f,
  origin[1]+(end[1]-origin[1])*f);
 text(220,300,"Вектор в анатомической системе координат");
}
function movingDrawing(q,t){
 $("drawing").innerHTML="";
 if(q.type==="elbow"){
  // Side view, face left, upper arm fixed.
  head(190,50,"side");
  line(190,76,190,171,"#c4d9ff",10);
  const ex=190,ey=171,L=95;
  circle(ex,ey,6);
  // Extended forearm points down, flexed forearm points left.
  const angle=(q.v==="flex"?t:1-t)*Math.PI*.48;
  const hx=ex-L*Math.sin(angle);
  const hy=ey+L*Math.cos(angle);
  line(ex,ey,hx,hy,"#46e4ad",10);
  circle(hx,hy,5,"#46e4ad");
  const start=q.v==="flex"?0:Math.PI*.48;
  const end=q.v==="flex"?Math.PI*.48:0;
  const rad=62;
  const p1=[ex-rad*Math.sin(start),ey+rad*Math.cos(start)];
  const p2=[ex-rad*Math.sin(end),ey+rad*Math.cos(end)];
  const mid=(start+end)/2;
  const pm=[ex-rad*Math.sin(mid),ey+rad*Math.cos(mid)];
  path(`M${p1.join(" ")} Q${pm[0]-12} ${pm[1]+8} ${p2.join(" ")}`,
   "#46e4ad",2,"5 5");
  const a=Math.atan2(p2[1]-pm[1],p2[0]-pm[0]);
  line(p2[0],p2[1],p2[0]-11*Math.cos(a-.5),
   p2[1]-11*Math.sin(a-.5),"#46e4ad",3);
  line(p2[0],p2[1],p2[0]-11*Math.cos(a+.5),
   p2[1]-11*Math.sin(a+.5),"#46e4ad",3);
  text(215,305,"Вид сбоку: локтевой сустав");
 }
 if(q.type==="shoulder"){
  head(220,43,"front");
  line(220,70,220,187,"#c4d9ff",9);
  line(220,187,190,267);
  line(220,187,250,267);
  line(220,96,260,163);
  const amount=(q.v==="abduct"?t:1-t)*1.32;
  const x=220-95*Math.sin(amount);
  const y=96+95*Math.cos(amount);
  line(220,96,x,y,"#46e4ad",10);
  circle(220,96,5);
  circle(x,y,4,"#46e4ad");
  const a1=q.v==="abduct"?0:1.32;
  const a2=q.v==="abduct"?1.32:0;
  const point=a=>[220-72*Math.sin(a),96+72*Math.cos(a)];
  const P=point(a1),Q=point(a2);
  const M=point((a1+a2)/2);
  path(`M${P.join(" ")} Q${M[0]-8} ${M[1]+5} ${Q.join(" ")}`,
   "#46e4ad",2,"5 5");
  arrow(M[0],M[1],Q[0],Q[1]);
  text(220,305,"Вид спереди: плечевой сустав");
 }
 if(q.type==="forearm"){
  // Transverse section representation of palm orientation.
  head(220,42,"front");
  line(220,67,220,160,"#c4d9ff",10);
  circle(220,164,6);
  const a=(q.v==="pronate"?t:1-t)*Math.PI;
  const width=75*Math.cos(a);
  el("ellipse",{cx:220,cy:208,rx:Math.max(7,Math.abs(width)),
   ry:17,fill:"#46e4ad","fill-opacity":.35,
   stroke:"#46e4ad","stroke-width":3});
  line(220-width,208,220+width,208,"#46e4ad",5);
  path("M160 260 Q220 295 280 260","#46e4ad",2,"5 5");
  text(220,310,"Условная схема вращения предплечья");
 }
 if(q.type==="foot"){
  // Frontal view of right foot, simplified roll.
  head(220,35,"front",.6);
  line(220,55,220,130,"#c4d9ff",7);
  line(220,130,220,208,"#c4d9ff",12);
  circle(220,208,6);
  const a=(q.v==="invert"?-1:1)*t*.48;
  const g=el("g",{
   transform:`rotate(${a*180/Math.PI} 220 210)`
  });
  el("ellipse",{cx:220,cy:239,rx:49,ry:21,
   fill:"#46e4ad","fill-opacity":.3,
   stroke:"#46e4ad","stroke-width":4},g);
  line(220,210,220,238,"#46e4ad",6,g);
  text(220,305,"Условная фронтальная проекция стопы");
 }
}
function replay(){
 const q=pool[index];
 if(!q)return;
 clear();
 const moving=["elbow","shoulder","forearm","foot"];
 if(moving.includes(q.type)){
  $("visualNote").textContent="Зелёный сегмент движется автоматически";
  cycle(t=>movingDrawing(q,t));
 }else if(q.type==="plane"){
  $("visualNote").textContent="Полупрозрачная анатомическая плоскость";
  cycle(t=>drawPlane(q.v,t));
 }else if(q.type==="vector"){
  $("visualNote").textContent="Составное пространственное направление";
  cycle(t=>drawVector(q.v,t));
 }else{
  $("visualNote").textContent="Определи направление стрелки";
  staticDrawing(q);
 }
}
function shuffle(array){
 const a=[...array];
 for(let i=a.length-1;i>0;i--){
  const j=Math.floor(Math.random()*(i+1));
  [a[i],a[j]]=[a[j],a[i]];
 }
 return a;
}
function restart(){
 clear();
 pool=shuffle(questions.filter(q=>
  $("category").value==="all"||
  q.cat===$("category").value
 )).slice(0,10);
 index=0;correct=0;
 $("results").style.display="none";
 $("drawing").style.display="block";
 $(".none");
 showQuestion();
}
function showQuestion(){
 locked=false;
 const q=pool[index];
 $("counter").textContent=`Вопрос ${index+1} из ${pool.length}`;
 $("score").textContent=`Правильно: ${correct}`;
 $("progress").style.width=(index/pool.length*100)+"%";
 $("topic").textContent={
  directions:"АНАТОМИЧЕСКИЕ НАПРАВЛЕНИЯ",
  movements:"ДВИЖЕНИЯ СУСТАВОВ",
  planes:"АНАТОМИЧЕСКИЕ ПЛОСКОСТИ",
  advanced:"СОСТАВНЫЕ НАПРАВЛЕНИЯ"
 }[q.cat];
 $("question").textContent=$("mode").value==="visual"?
  q.q:`Какое определение соответствует термину «${q.term}»?`;
 $("feedback").textContent="";
 $("next").classList.add("hidden");
 $("answers").innerHTML="";
 let options;
 if($("mode").value==="visual"){
  options=shuffle(q.opts);
 }else{
  const alternatives=shuffle(
   questions.filter(x=>x!==q&&x.cat===q.cat)
    .map(x=>x.ex).filter(x=>x!==q.ex)
  ).slice(0,3);
  options=shuffle([q.ex,...alternatives]);
 }
 options.forEach(value=>{
  const b=document.createElement("button");
  b.textContent=value;
  const right=$("mode").value==="visual"?q.term:q.ex;
  b.onclick=()=>answer(b,value,right);
  $("answers").appendChild(b);
 });
 replay();
}
function answer(button,value,right){
 if(locked)return;
 locked=true;
 const ok=value===right;
 if(ok)correct++;
 stats.done++;
 if(ok)stats.correct++;
 try{
  localStorage.setItem("anatomyStats12",JSON.stringify(stats));
 }catch(e){}
 document.querySelectorAll("#answers button").forEach(b=>{
  b.disabled=true;
  if(b.textContent===right)b.classList.add("correct");
 });
 if(!ok)button.classList.add("wrong");
 $("feedback").innerHTML="";
 const heading=document.createElement("strong");
 heading.textContent=ok?"✓ Правильно!":"✗ Неправильно";
 const explanation=document.createElement("p");
 explanation.textContent=pool[index].ex;
 $("feedback").append(heading,explanation);
 $("score").textContent=`Правильно: ${correct}`;
 $("next").textContent=index===pool.length-1?
  "Завершить тренировку":"Следующий вопрос →";
 $("next").classList.remove("hidden");
}
function nextQuestion(){
 index++;
 if(index>=pool.length){
  clear();
  $("progress").style.width="100%";
  $("results").style.display="block";
  $("results").innerHTML="";
  const h=document.createElement("h2");
  h.textContent="Тренировка завершена";
  const p=document.createElement("p");
  p.textContent=`Результат: ${correct} из ${pool.length}`;
  const total=document.createElement("p");
  total.textContent=`За всё время в версии 1.2: ${stats.correct} правильных из ${stats.done}`;
  const b=document.createElement("button");
  b.textContent="Новая тренировка";
  b.onclick=restart;
  $("results").append(h,p,total,b);
  $("next").classList.add("hidden");
  $("answers").innerHTML="";
  $("question").textContent="Готово!";
  $("visualNote").textContent="";
  return;
 }
 showQuestion();
}
restart();
</script>

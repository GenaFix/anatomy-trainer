
<!-- Anatomy Trainer 1.8: экспериментальная лаборатория -->
<section class="panel" id="lab18" style="max-width:1080px;margin:15px auto">
  <h2>🦴 Anatomy Trainer 1.8 • Лаборатория</h2>
  <p class="muted">Слои мышц и экспериментальная кинематика</p>

  <div class="toolbar">
    <button id="labHide">Скрыть выбранную</button>
    <button id="labFade">Прозрачность 35%</button>
    <button id="labRestore">Вернуть все</button>
  </div>

  <div class="toolbar">
    <button id="labFront">Спереди</button>
    <button id="labBack">Сзади</button>
    <button id="labSide">Сбоку</button>
  </div>

  <div id="labStage" style="
    height:440px;position:relative;
    background:#09182c;border-radius:12px;
    overflow:hidden;touch-action:none">
  </div>

  <p id="labStatus">Загрузка анатомической модели...</p>
  <p id="labSelected">Нажми на мышцу, чтобы выбрать её.</p>

  <div class="toolbar">
    <button id="labElbow">Проверить локоть</button>
    <button id="labStop">Остановить</button>
  </div>
  <p class="small" id="labMotionInfo">
    Экспериментальный режим. Точность движения пока не подтверждена.
  </p>
</section>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import {OrbitControls} from
  'three/addons/controls/OrbitControls.js';
import {GLTFLoader} from
  'three/addons/loaders/GLTFLoader.js';
import {MeshoptDecoder} from
  'three/addons/libs/meshopt_decoder.module.js';

const el=id=>document.getElementById(id);
const stage=el('labStage');

const scene=new THREE.Scene();
scene.background=new THREE.Color('#09182c');

const camera=new THREE.PerspectiveCamera(36,1,.01,100);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
stage.append(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x35435c,2.5));

const light=new THREE.DirectionalLight(0xffffff,2);
light.position.set(3,6,5);
scene.add(light);

const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;

let root=null;
let meshes=[];
let selected=null;
let target=new THREE.Vector3(0,1,0);
let distance=3.5;
let view='front';
let elbowTest=false;

const originals=new Map();

function resize(){
  const w=stage.clientWidth;
  const h=stage.clientHeight;
  renderer.setSize(w,h,false);
  camera.aspect=w/h;
  camera.updateProjectionMatrix();
}

new ResizeObserver(resize).observe(stage);

function setView(name){
  view=name;
  const vectors={
    front:[0,0,1],
    back:[0,0,-1],
    side:[1,0,0]
  };
  const v=vectors[name];
  camera.position.set(
    target.x+v[0]*distance,
    target.y,
    target.z+v[2]*distance
  );
  controls.target.copy(target);
  controls.update();
}

el('labFront').onclick=()=>setView('front');
el('labBack').onclick=()=>setView('back');
el('labSide').onclick=()=>setView('side');

function saveOriginal(mesh){
  if(originals.has(mesh))return;
  originals.set(mesh,{
    material:mesh.material,
    visible:mesh.visible
  });
}

function cloneMaterial(material){
  if(Array.isArray(material)){
    return material.map(m=>m.clone());
  }
  return material.clone();
}

function fadeMesh(mesh){
  saveOriginal(mesh);
  const mat=cloneMaterial(originals.get(mesh).material);
  const list=Array.isArray(mat)?mat:[mat];
  list.forEach(m=>{
    m.transparent=true;
    m.opacity=.35;
    m.depthWrite=false;
    m.needsUpdate=true;
  });
  mesh.material=mat;
  mesh.visible=true;
}

function restoreMesh(mesh){
  const old=originals.get(mesh);
  if(!old)return;
  const current=mesh.material;
  if(current!==old.material){
    const list=Array.isArray(current)?current:[current];
    list.forEach(m=>m.dispose());
  }
  mesh.material=old.material;
  mesh.visible=old.visible;
}

el('labHide').onclick=()=>{
  if(!selected)return;
  saveOriginal(selected);
  selected.visible=false;
  el('labStatus').textContent='Структура скрыта';
};

el('labFade').onclick=()=>{
  if(!selected)return;
  fadeMesh(selected);
  el('labStatus').textContent='Прозрачность: 35%';
};

el('labRestore').onclick=()=>{
  originals.forEach((_,mesh)=>restoreMesh(mesh));
  originals.clear();
  selected=null;
  el('labSelected').textContent='Все структуры восстановлены';
  el('labStatus').textContent='Модель восстановлена';
};

const raycaster=new THREE.Raycaster();
const pointer=new THREE.Vector2();
let down=null;

renderer.domElement.addEventListener('pointerdown',e=>{
  down={x:e.clientX,y:e.clientY};
});

renderer.domElement.addEventListener('pointerup',e=>{
  if(!down)return;
  if(Math.hypot(e.clientX-down.x,e.clientY-down.y)>7)return;

  const r=renderer.domElement.getBoundingClientRect();
  pointer.set(
    (e.clientX-r.left)/r.width*2-1,
    -(e.clientY-r.top)/r.height*2+1
  );
  raycaster.setFromCamera(pointer,camera);

  const hit=raycaster.intersectObjects(
    meshes.filter(m=>m.visible),false
  )[0];

  if(hit){
    selected=hit.object;
    el('labSelected').textContent=
      'Выбрана структура: '+(selected.name||'Без названия');
  }
});

const loader=new GLTFLoader();
loader.setMeshoptDecoder(MeshoptDecoder);

loader.load(
 'https://cdn.jsdelivr.net/gh/Charleeh/ecorche@main/model/ecorche.meshopt.glb',
 gltf=>{
   root=gltf.scene;
   scene.add(root);
   root.updateMatrixWorld(true);

   let box=new THREE.Box3().setFromObject(root);
   let size=box.getSize(new THREE.Vector3());

   if(size.y<.1||size.y>10){
     root.scale.multiplyScalar(1.75/size.y);
     root.updateMatrixWorld(true);
   }

   box=new THREE.Box3().setFromObject(root);
   const c=box.getCenter(new THREE.Vector3());
   root.position.x-=c.x;
   root.position.z-=c.z;
   root.position.y-=box.min.y;
   root.updateMatrixWorld(true);

   box=new THREE.Box3().setFromObject(root);
   size=box.getSize(new THREE.Vector3());

   target.set(0,box.min.y+size.y*.53,0);
   distance=Math.max(2.7,size.y*1.9);

   root.traverse(o=>{
     if(o.isMesh)meshes.push(o);
   });

   setView('front');
   el('labStatus').textContent=
     'Модель загружена. Структур: '+meshes.length;
 },
 e=>{
   if(e.total){
     el('labStatus').textContent=
       'Загрузка: '+Math.round(e.loaded/e.total*100)+'%';
   }
 },
 err=>{
   console.error(err);
   el('labStatus').textContent='Ошибка загрузки модели';
 }
);

// Проверяем, имеются ли готовые кости для анимации.
el('labElbow').onclick=()=>{
  if(!root)return;

  let bones=0;
  let skinned=0;
  root.traverse(o=>{
    if(o.isBone)bones++;
    if(o.isSkinnedMesh)skinned++;
  });

  elbowTest=true;
  el('labMotionInfo').textContent=
    'Проверка завершена. Bones: '+bones+
    ', SkinnedMesh: '+skinned+
    '. Наличие этих объектов само по себе не подтверждает '+
    'готовность локтевого сустава к анимации. '+
    'Движение не запускается до проверки осей и привязок.';
};

el('labStop').onclick=()=>{
  elbowTest=false;
  el('labMotionInfo').textContent=
    'Эксперимент остановлен.';
};

function animate(){
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene,camera);
}

resize();
setView('front');
animate();
</script>
<!-- Конец лаборатории 1.8 -->


<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anatomy Trainer 2.8</title>
<link rel="stylesheet" href="./style.css?v=compact1">

<script type="importmap">
{
  "imports":{
    "three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js",
    "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"
  }
}
</script>
</head>

<body>
<main>

<header class="topbar">
  <h1>🦴 Anatomy Trainer 2.8</h1>
  <div class="controls">
    <label for="language">Язык:</label>
    <select id="language">
      <option value="ru">Русский</option>
      <option value="en">English</option>
      <option value="both">RU + EN</option>
    </select>
  </div>
</header>

<section class="panel">
  <div class="controls">
    <button class="active" id="digitalBtn">
      Движения и направления
    </button>
    <button id="muscleBtn" disabled
      title="Подключим следующим этапом">
      Мышцы Écorché (скоро)
    </button>
  </div>
</section>

<div class="workspace">

  <section class="panel">
    <div class="controls" id="viewControls">
      <button data-view="front">Спереди</button>
      <button data-view="back">Сзади</button>
      <button data-view="right">Справа</button>
      <button data-view="left">Слева</button>
      <button id="resetView">Сброс</button>
    </div>

    <button id="touchRotate" type="button" hidden aria-pressed="false">Вращать 3D-модель</button>
    <div id="stage">
      <div id="viewLabel">3D-модель</div>
    </div>

    <p id="status">Подготовка модели...</p>
  </section>

  <section class="panel" id="quizPanel">
    <h3>Проверка знаний</h3>

    <div class="controls quiz-settings">
      <div class="setting-field"><label for="topic">Тема:</label>
      <select id="topic">
        <option value="all">Все темы</option>
        <option value="movements">Движения суставов</option>
        <option value="directions">Анатомические направления</option>
        <option value="planes">Анатомические плоскости</option>
      </select></div>
      <div class="setting-field"><label for="questionCount">Вопросов:</label>
      <select id="questionCount">
        <option value="all">Все</option>
        <option value="5">5</option>
        <option value="10">10</option>
      </select></div>
    </div>
    <p id="counter">Подготовка вопросов...</p>

    <h3 id="question"></h3>

    <div id="answers"></div>

    <div id="feedback"></div>

    <button id="next" disabled>
      Следующий вопрос
    </button>

    <div id="resultTools" class="hidden">
      <button id="repeat">
        Повторить ошибки
      </button>
      <button id="restart">
        Новый тест
      </button>
    </div>
  </section>

</div>

<p class="small muted">
  Интерактивный тест движений, направлений и анатомических плоскостей.
  Анимации схематические и не предназначены
  для клинической оценки суставов.
</p>

</main>

<script type="module" src="./app.js?v=depth1"></script>
</body>
</html>

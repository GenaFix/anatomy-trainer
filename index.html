
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Anatomy Trainer 1.5</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#091426;color:#eaf3ff;font-family:system-ui,Arial}
main{max-width:980px;margin:auto;padding:12px}
h1{font-size:24px;margin:5px 0}
small{color:#b7c9e1}
.panel{background:#172b49;border:1px solid #496b94;border-radius:16px;padding:14px;margin-top:12px}
button,select{background:#29466b;color:#fff;border:1px solid #6484af;border-radius:10px;padding:10px;font:inherit;cursor:pointer}
.controls,.views{display:flex;gap:7px;flex-wrap:wrap;justify-content:center}
.status{display:flex;justify-content:space-between;margin:12px 0}
.track{height:7px;background:#344d70;border-radius:10px}
#progress{height:100%;width:0;background:#3ac7ec}
.stage{background:#0c1b31;border-radius:12px;margin:10px 0;padding:8px;text-align:center}
#scene{width:100%;height:350px;touch-action:none}
#scene canvas{display:block}
.views button{font-size:12px;padding:6px}
#note{color:#b7c9e1;font-size:12px}
#question{font-size:21px}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.answers button{text-align:left;min-height:55px}
.correct{background:#116e50!important;border-color:#5ff0b6}
.wrong{background:#823b51!important;border-color:#ff8098}
#feedback{margin:12px 0;line-height:1.5}
#next{width:100%;background:#177da5;margin-top:10px}
.hidden{display:none}
footer{font-size:12px;color:#b7c9e1;padding:12px}
@media(max-width:650px){
main{padding:6px}
h1{font-size:19px}
.panel{padding:9px}
.controls{display:grid;grid-template-columns:1fr 1fr}
.controls select{width:100%;min-width:0;font-size:12px;padding:7px 3px}
.controls select:last-child{grid-column:1/-1}
#scene{height:clamp(185px,29dvh,250px)}
#question{font-size:16px}
.answers button{font-size:12px;min-height:47px;padding:7px}
.status{font-size:13px}
}
</style>
</head>
<body>
<main>
<header>
<h1>🦴 Anatomy Trainer 1.5</h1>
<small>Интерактивная 3D-анатомия</small>
</header>
<section class="panel">
<div class="controls">
<select id="category">
<option value="all">Все категории</option>
<option value="directions">Направления</option>
<option value="advanced">Составные направления</option>
<option value="movements">Движения суставов</option>
<option value="planes">Плоскости</option>
</select>
<select id="level">
<option value="all">Все уровни</option>
<option value="1">Уровень 1</option>
<option value="2">Уровень 2</option>
<option value="3">Уровень 3</option>
</select>
<select id="mode">
<option value="visual">Угадай по 3D</option>
<option value="text">Термин → определение</option>
<option value="mixed">Смешанная тренировка</option>
</select>
</div>
<div class="status">
<span id="counter"></span><span id="score"></span>
</div>
<div class="track"><div id="progress"></div></div>
<div class="stage">
<small>ТРЁХМЕРНАЯ АНАТОМИЧЕСКАЯ СЦЕНА</small>
<div id="scene"></div>
<div class="views">
<button onclick="setView(0)">Спереди</button>
<button onclick="setView(Math.PI)">Сзади</button>
<button onclick="setView(Math.PI/2)">Сбоку</button>
</div>
<p id="note"></p>
</div>
<small id="categoryLabel"></small>
<h2 id="question"></h2>
<div class="answers" id="answers"></div>
<div id="feedback"></div>
<button id="next" class="hidden">Следующий вопрос →</button>
</section>
<footer>
Учебные трёхмерные модели. Движения суставов упрощены и не заменяют анатомический атлас.
</footer>
</main>

<script type="module">
import * as T from "https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js";

const $=id=>document.getElementById(id);
const Q=[];
const words=[
["краниально","каудально"],
["латерально","медиально"],
["дорзально","вентрально"]
];

function add(cat,level,term,type,v,ex){
Q.push({cat,level,term,type,v,ex});
}

function description(v){
return v.map((n,i)=>n?words[i][n>0?0:1]:null).filter(Boolean).join(", ");
}

const directions=[
["Краниально",[1,0,0],1],
["Каудально",[-1,0,0],1],
["Латерально",[0,1,0],1],
["Медиально",[0,-1,0],1],
["Дорзально",[0,0,1],1],
["Вентрально",[0,0,-1],1],
["Кранио-латерально",[1,1,0],2],
["Каудо-медиально",[-1,-1,0],2],
["Дорзо-краниально",[1,0,1],2],
["Вентро-каудально",[-1,0,-1],2],
["Кранио-медиально",[1,-1,0],2],
["Каудо-латерально",[-1,1,0],2],
["Дорзо-латерально",[0,1,1],2],
["Вентро-медиально",[0,-1,-1],2],
["Дорзо-кранио-латерально",[1,1,1],3],
["Вентро-каудо-медиально",[-1,-1,-1],3],
["Вентро-кранио-латерально",[1,1,-1],3],
["Дорзо-каудо-медиально",[-1,-1,1],3],
["Вентро-кранио-медиально",[1,-1,-1],3]
];
directions.forEach(([term,v,l])=>
add(l===1?"directions":"advanced",l,term,"vector",v,"Направление: "+description(v))
);

add("directions",1,"Проксимально","limb","prox","Ближе к месту прикрепления конечности к туловищу.");
add("directions",1,"Дистально","limb","dist","Дальше от места прикрепления конечности к туловищу.");

[
["Флексия","elbow","flex","Сгибание локтя: угол между плечом и предплечьем уменьшается."],
["Экстензия","elbow","extend","Разгибание локтя: угол увеличивается."],
["Абдукция","shoulder","abduct","Отведение плеча от средней линии тела."],
["Аддукция","shoulder","adduct","Приведение плеча к средней линии тела."],
["Пронация","forearm","pronate","Вращение предплечья, при котором ладонь из положения вверх обращается вниз."],
["Супинация","forearm","supinate","Вращение предплечья, при котором ладонь из положения вниз обращается вверх."],
["Инверсия","foot","invert","Подошвенная поверхность стопы обращается медиально."],
["Эверсия","foot","evert","Подошвенная поверхность стопы обращается латерально."]
].forEach(([term,type,v,ex])=>add("movements",1,term,type,v,ex));

[
["Сагиттальная","sag","Разделяет тело на правую и левую части."],
["Фронтальная","front","Разделяет тело на переднюю и заднюю части."],
["Поперечная","trans","Разделяет тело на верхнюю и нижнюю части."]
].forEach(([term,v,ex])=>add("planes",1,term,"plane",v,ex));

// THREE.JS
const scene=new T.Scene();
scene.background=new T.Color("#0c1b31");
const camera=new T.PerspectiveCamera(38,1,.1,100);
const renderer=new T.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
$("scene").appendChild(renderer.domElement);

scene.add(new T.HemisphereLight(0xffffff,0x29415f,2));
const light=new T.DirectionalLight(0xffffff,2);
light.position.set(3,6,6);
scene.add(light);

const root=new T.Group();
scene.add(root);

const material=c=>new T.MeshStandardMaterial({color:c,roughness:.65,side:T.DoubleSide});
const bone=material("#d7e4f0");
const green=material("#43e7b2");
const skin=material("#c18b76");
const joint=material("#7da1ca");
let moving=[];
let angle=0,phi=.12,dist=7.5;
const focus=new T.Vector3(0,1.4,0);

function ball(p,x,y,z,r,m=joint){
let o=new T.Mesh(new T.SphereGeometry(r,16,12),m);
o.position.set(x,y,z);p.add(o);return o;
}
function box(p,x,y,z,w,h,d,m){
let o=new T.Mesh(new T.BoxGeometry(w,h,d),m);
o.position.set(x,y,z);p.add(o);return o;
}
function segment(p,a,b,r,m){
let A=new T.Vector3(...a),B=new T.Vector3(...b);
let d=B.clone().sub(A);
let o=new T.Mesh(new T.CylinderGeometry(r,r,d.length(),12),m);
o.position.copy(A).add(B).multiplyScalar(.5);
o.quaternion.setFromUnitVectors(new T.Vector3(0,1,0),d.normalize());
p.add(o);return o;
}
function clear(){
while(root.children.length)root.remove(root.children[0]);
moving=[];
}
function pelvis(){
box(root,0,2.5,0,1.1,.35,.42,bone);
}
function legs(q){
pelvis();
for(let s of [-1,1]){
let x=s*.43;
ball(root,x,2.38,0,.16);
segment(root,[x,2.38,0],[x,1.42,0],.13,bone);
ball(root,x,1.4,0,.14);
segment(root,[x,1.4,0],[x,.38,0],.105,bone);
let pivot=new T.Group();
pivot.position.set(x,.33,0);
root.add(pivot);
ball(pivot,0,0,0,.12);
let active=q.type==="foot"&&s===1;
let foot=new T.Group();
pivot.add(foot);
box(foot,0,-.14,.35,.34,.20,.8,active?green:bone);
for(let i=0;i<5;i++)
ball(foot,(i-2)*.065,-.13,.78,.045,active?green:bone);
if(active)moving.push({
o:pivot,
axis:"z",
sign:q.v==="invert"?1:-1,
amount:.36
});
}
}
function arms(q){
ball(root,0,2.85,0,.3,skin);
segment(root,[0,2.5,0],[0,1.4,0],.24,bone);
box(root,0,2.32,0,1.3,.24,.35,bone);
for(let s of [-1,1]){
let x=s*.67;
ball(root,x,2.32,0,.14);
let arm=new T.Group();
arm.position.set(x,2.32,0);root.add(arm);
segment(arm,[0,0,0],[0,-.78,0],.11,bone);
ball(arm,0,-.78,0,.12);
let fore=new T.Group();
fore.position.y=-.78;arm.add(fore);
segment(fore,[0,0,0],[0,-.72,0],.085,s===1?green:bone);
let hand=new T.Group();
hand.position.y=-.8;fore.add(hand);
box(hand,0,-.16,0,.24,.31,.12,s===1?green:bone);
for(let i=0;i<4;i++)
segment(hand,[(i-1.5)*.056,-.3,0],[(i-1.5)*.056,-.5,0],.025,s===1?green:bone);
segment(hand,[.13,-.07,0],[.25,-.23,.05],.04,s===1?green:bone);
if(s===1){
if(q.type==="elbow")
moving.push({o:fore,axis:"z",sign:q.v==="flex"?-1:1,amount:1.3});
if(q.type==="shoulder")
moving.push({o:arm,axis:"z",sign:q.v==="abduct"?-1:1,amount:.9});
if(q.type==="forearm"){
fore.rotation.z=-Math.PI/2;
moving.push({o:fore,axis:"y",sign:q.v==="pronate"?1:-1,amount:Math.PI*.8});
}
}
}
}
function arrows(q){
let v=q.type==="vector"?q.v:q.v==="prox"?[1,0,0]:[-1,0,0];
let d=new T.Vector3(v[1],v[0],-v[2]).normalize();
root.add(new T.ArrowHelper(d,new T.Vector3(0,1.5,0),1.7,0x43e7b2,.25,.15));
for(let a of [
new T.Vector3(0,1,0),
new T.Vector3(1,0,0),
new T.Vector3(0,0,-1)
])root.add(new T.ArrowHelper(a,new T.Vector3(0,1.5,0),1.2,0x6488aa,.13,.08));
}
function planes(q){
arms(q);
let m=new T.Mesh(
new T.PlaneGeometry(2.2,3.3),
new T.MeshBasicMaterial({color:0x43c9e7,transparent:true,opacity:.3,side:T.DoubleSide,depthWrite:false})
);
m.position.y=1.7;
if(q.v==="sag")m.rotation.y=Math.PI/2;
if(q.v==="trans")m.rotation.x=Math.PI/2;
root.add(m);
}
function build(q){
clear();
if(q.type==="foot")legs(q);
else if(["elbow","shoulder","forearm"].includes(q.type))arms(q);
else if(q.type==="plane")planes(q);
else arrows(q);
$("note").textContent=q.type==="foot"?
"Две ноги. Движется левая стопа человека, справа на экране.":
"Вращай модель пальцем или мышью. Анимация повторяется.";
}
function updateCamera(){
camera.position.set(
focus.x+dist*Math.sin(angle)*Math.cos(phi),
focus.y+dist*Math.sin(phi),
focus.z+dist*Math.cos(angle)*Math.cos(phi)
);
camera.lookAt(focus);
}
window.setView=a=>{angle=a;phi=.12;updateCamera()};
updateCamera();

const canvas=renderer.domElement;
let drag=null;
canvas.onpointerdown=e=>{
drag=[e.clientX,e.clientY];
canvas.setPointerCapture(e.pointerId);
};
canvas.onpointermove=e=>{
if(!drag)return;
angle-=(e.clientX-drag[0])*.009;
phi=Math.max(-1.1,Math.min(1.1,phi+(e.clientY-drag[1])*.007));
drag=[e.clientX,e.clientY];updateCamera();
};
canvas.onpointerup=()=>drag=null;
canvas.onpointercancel=()=>drag=null;
canvas.addEventListener("wheel",e=>{
e.preventDefault();
dist=Math.max(3,Math.min(13,dist+e.deltaY*.007));
updateCamera();
},{passive:false});

function resize(){
let w=$("scene").clientWidth,h=$("scene").clientHeight;
renderer.setSize(w,h,false);
camera.aspect=w/h;camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe($("scene"));
resize();

function frame(t){
requestAnimationFrame(frame);
let p=(1-Math.cos(t*.002))/2;
for(let m of moving)m.o.rotation[m.axis]=m.sign*m.amount*p;
renderer.render(scene,camera);
}
requestAnimationFrame(frame);

// ВИКТОРИНА
function shuffle(a){
a=[...a];
for(let i=a.length-1;i>0;i--){
let j=Math.floor(Math.random()*(i+1));
[a[i],a[j]]=[a[j],a[i]];
}
return a;
}
let pool=[],index=0,score=0,locked=false;

function start(){
let cat=$("category").value,level=$("level").value;
let a=Q.filter(q=>(cat==="all"||q.cat===cat)&&(level==="all"||q.level===+level));
pool=shuffle(a).slice(0,10);
index=0;score=0;
if(!pool.length){
$("question").textContent="Нет вопросов для выбранных фильтров.";
$("answers").innerHTML="";
return;
}
show();
}
function show(){
locked=false;
let q=pool[index];
$("counter").textContent=`Вопрос ${index+1} из ${pool.length}`;
$("score").textContent=`Правильно: ${score}`;
$("progress").style.width=(100*index/pool.length)+"%";
$("categoryLabel").textContent=q.cat==="movements"?"ДВИЖЕНИЯ СУСТАВОВ":q.cat==="planes"?"ПЛОСКОСТИ":"АНАТОМИЧЕСКИЕ НАПРАВЛЕНИЯ";
$("feedback").textContent="";
$("next").classList.add("hidden");
build(q);

let mode=$("mode").value;
if(mode==="mixed")mode=Math.random()<.5?"text":"visual";
$("question").textContent=mode==="text"?
`Какое определение соответствует термину «${q.term}»?`:
q.type==="vector"?"Назови направление вектора.":
q.type==="plane"?"Какая плоскость показана?":
"Как называется показанное движение или направление?";

let others=shuffle(Q.filter(x=>x!==q&&x.cat===q.cat));
let options=shuffle([q,...others.slice(0,3)]);
$("answers").innerHTML="";
let correctButton;

options.forEach(opt=>{
let b=document.createElement("button");
b.textContent=mode==="text"?opt.ex:opt.term;
$("answers").appendChild(b);
if(opt===q)correctButton=b;
b.onclick=()=>{
if(locked)return;
locked=true;
let ok=opt===q;
if(ok)score++;
$("answers").querySelectorAll("button").forEach(x=>x.disabled=true);
b.classList.add(ok?"correct":"wrong");
correctButton.classList.add("correct");
$("feedback").textContent=(ok?"✓ Правильно. ":"✗ Неправильно. ")+`Правильный ответ: ${q.term}. ${q.ex}`;
$("score").textContent=`Правильно: ${score}`;
$("next").textContent=index===pool.length-1?"Завершить тренировку":"Следующий вопрос →";
$("next").classList.remove("hidden");
if(matchMedia("(max-width:650px)").matches)
$("feedback").scrollIntoView({behavior:"smooth",block:"nearest"});
};
});
}
$("next").onclick=()=>{
index++;
if(index<pool.length){
show();
if(matchMedia("(max-width:650px)").matches)
$("scene").scrollIntoView({behavior:"smooth",block:"start"});
}else{
$("question").textContent=`Тренировка завершена: ${score} из ${pool.length}`;
$("answers").innerHTML="";
$("feedback").textContent="";
$("next").textContent="Новая тренировка";
$("next").onclick=()=>{ $("next").onclick=null;location.reload(); };
$("progress").style.width="100%";
}
};
["category","level","mode"].forEach(id=>$(id).onchange=start);
start();
</script>
</body>
</html>

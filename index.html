
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Anatomy Trainer 1.3</title>
<style>
:root{
 --bg:#0b1425;--panel:#152640;--stage:#0c1a30;
 --line:#39577d;--text:#edf5ff;--muted:#adc3df;
 --green:#43e3ac;--blue:#38bdf8
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
 font-family:Arial,Helvetica,sans-serif}
main{max-width:960px;margin:auto;padding:15px}
header{display:flex;justify-content:space-between;align-items:center;gap:10px}
h1{font-size:25px;margin:5px 0}
small,.muted{color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--line);
 border-radius:17px;padding:18px;margin-top:16px}
.controls{display:flex;flex-wrap:wrap;gap:9px;justify-content:center}
button,select{background:#29466d;border:1px solid #607da5;
 color:white;border-radius:10px;padding:12px;font-size:15px;cursor:pointer}
button:hover{background:#385c87}
button:disabled{cursor:default;opacity:.8}
.top{display:flex;justify-content:space-between;margin-top:18px;
 gap:10px;color:#c5d8ef}
.bar{height:9px;background:#344b69;border-radius:9px;
 overflow:hidden;margin:14px 0}
#progress{height:100%;background:var(--blue);width:0;transition:.25s}
.stage{background:var(--stage);border-radius:14px;padding:12px;
 text-align:center;margin:14px 0}
#drawing{width:100%;max-width:520px;height:320px;display:block;margin:auto}
#visualNote{font-size:13px;color:var(--muted);min-height:22px}
#question{font-size:21px;line-height:1.45}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:15px}
.answers button{text-align:left;min-height:58px}
.answers button.vectorChoice{text-align:center}
.vectorChoice svg{width:100%;max-width:190px;height:125px;display:block;margin:auto}
.correct{background:#176b50!important;border-color:#4ade80!important}
.wrong{background:#813b49!important;border-color:#fb7185!important}
#feedback{line-height:1.55;margin-top:15px}
#next{background:#167ca5;width:100%;margin-top:15px}
.hidden{display:none!important}
#results{display:none}
.note{font-size:13px;line-height:1.6;color:var(--muted)}
@media(max-width:550px){
 main{padding:9px}.card{padding:12px}
 .answers{grid-template-columns:1fr}
 #drawing{height:265px}h1{font-size:21px}
 #question{font-size:19px}
}
</style>
</head>
<body>
<main>
<header>
<div>
<h1>🦴 Anatomy Trainer <small>1.3</small></h1>
<small>Анатомическое пространственное мышление</small>
</div>
<button id="restart" title="Новая тренировка">↻</button>
</header>

<section class="card">
<div class="controls">
<select id="category">
<option value="all">Все категории</option>
<option value="directions">Направления</option>
<option value="movements">Движения суставов</option>
<option value="planes">Анатомические плоскости</option>
<option value="advanced">Составные направления</option>
</select>
<select id="level">
<option value="all">Все уровни</option>
<option value="1">Уровень 1: основы</option>
<option value="2">Уровень 2: сочетания</option>
<option value="3">Уровень 3: три компонента</option>
</select>
<select id="mode">
<option value="visual">Изображение → термин</option>
<option value="reverse">Термин → изображение</option>
<option value="text">Термин → определение</option>
<option value="mixed">Смешанная тренировка</option>
</select>
</div>

<div class="top">
<span id="counter"></span>
<span id="score"></span>
</div>
<div class="bar"><div id="progress"></div></div>

<div class="stage">
<div id="visualTitle">АНАТОМИЧЕСКАЯ ВИЗУАЛИЗАЦИЯ</div>
<svg id="drawing" viewBox="0 0 440 320"></svg>
<div id="visualNote"></div>
</div>

<small id="topic"></small>
<h2 id="question"></h2>
<div id="answers" class="answers"></div>
<div id="feedback"></div>
<button id="next" class="hidden">Следующий вопрос →</button>
</section>

<section id="results" class="card"></section>
<p class="note">
Учебные схемы. Пространственные векторы показаны в условной
аксонометрической проекции. Движения суставов представлены
упрощённо и не заменяют анатомическую 3D-модель.
</p>
</main>

<script>
"use strict";
const $=id=>document.getElementById(id);
const NS="http://www.w3.org/2000/svg";

const Q=[];
function add(cat,level,term,type,v,ex,opts){
 Q.push({cat,level,term,type,v,ex,opts});
}

// Векторы: [краниально, латерально, дорзально].
// Отрицательные значения обозначают противоположные направления.
const vectors=[
 ["Краниально",[1,0,0],1],
 ["Каудально",[-1,0,0],1],
 ["Латерально",[0,1,0],1],
 ["Медиально",[0,-1,0],1],
 ["Дорзально",[0,0,1],1],
 ["Вентрально",[0,0,-1],1],
 ["Кранио-латерально",[1,1,0],2],
 ["Каудо-медиально",[-1,-1,0],2],
 ["Дорзо-краниально",[1,0,1],2],
 ["Вентро-каудально",[-1,0,-1],2],
 ["Кранио-медиально",[1,-1,0],2],
 ["Каудо-латерально",[-1,1,0],2],
 ["Дорзо-латерально",[0,1,1],2],
 ["Вентро-медиально",[0,-1,-1],2],
 ["Дорзо-кранио-латерально",[1,1,1],3],
 ["Вентро-каудо-медиально",[-1,-1,-1],3],
 ["Вентро-кранио-латерально",[1,1,-1],3],
 ["Дорзо-каудо-медиально",[-1,-1,1],3],
 ["Вентро-кранио-медиально",[1,-1,-1],3],
 ["Дорзо-каудо-латерально",[-1,1,1],3],
 ["Кранио-латеро-дорзально",[1,1,1],3],
 ["Вентро-латеро-краниально",[1,1,-1],3],
 ["Вентро-медио-краниально",[1,-1,-1],3]
];

// Эквивалентные варианты из атласа оставляем
// в словаре терминов, но не дублируем одинаковые
// пространственные векторы в вопросах.
const uniqueVectors=vectors.filter((item,i,arr)=>
 arr.findIndex(x=>JSON.stringify(x[1])===JSON.stringify(item[1]))===i
);

const components=[
 ["краниально","каудально"],
 ["латерально","медиально"],
 ["дорзально","вентрально"]
];

function vectorExplanation(v){
 return v.map((n,i)=>n===0?null:
  components[i][n>0?0:1]).filter(Boolean).join(", ");
}
uniqueVectors.forEach(([term,v,level])=>
 add(level===1?"directions":"advanced",level,
 term,"vector",v,
 "Направление: "+vectorExplanation(v)+".")
);

// Направления вдоль конечности
add("directions",1,"Проксимально","limb","prox",
 "Ближе к месту соединения конечности с туловищем.");
add("directions",1,"Дистально","limb","dist",
 "Дальше от места соединения конечности с туловищем.");

// Движения суставов
const movements=[
 ["Флексия","elbow","flex",
  "Сгибание локтя, уменьшение угла между плечом и предплечьем."],
 ["Экстензия","elbow","extend","Разгибание локтя."],
 ["Абдукция","shoulder","abduct",
  "Отведение плеча от туловища во фронтальной плоскости."],
 ["Аддукция","shoulder","adduct",
  "Приведение плеча к туловищу."],
 ["Пронация","forearm","pronate",
  "Вращение предплечья из положения ладонью вверх в положение ладонью вниз."],
 ["Супинация","forearm","supinate",
  "Вращение предплечья из положения ладонью вниз в положение ладонью вверх."],
 ["Инверсия","foot","invert",
  "Поворот подошвенной поверхности преимущественно медиально."],
 ["Эверсия","foot","evert",
  "Поворот подошвенной поверхности преимущественно латерально."]
];
movements.forEach(([term,type,v,ex])=>
 add("movements",1,term,type,v,ex)
);

// Плоскости
[
 ["Сагиттальная","sag",
  "Разделяет тело на правую и левую части."],
 ["Фронтальная","front",
  "Разделяет тело на переднюю и заднюю части."],
 ["Поперечная","trans",
  "Разделяет тело на верхнюю и нижнюю части."]
].forEach(([term,v,ex])=>
 add("planes",1,term,"plane",v,ex)
);

let pool=[],index=0,score=0,locked=false,raf=null;
let currentMode="visual";
let stats={done:0,correct:0};
try{
 const saved=JSON.parse(localStorage.getItem("anatomyStats13"));
 if(saved&&Number.isFinite(saved.done)&&Number.isFinite(saved.correct))
  stats=saved;
}catch(e){}

function shuffle(a){
 const b=[...a];
 for(let i=b.length-1;i>0;i--){
  const j=Math.floor(Math.random()*(i+1));
  [b[i],b[j]]=[b[j],b[i]];
 }
 return b;
}
function S(tag,attrs={},parent=$("drawing")){
 const e=document.createElementNS(NS,tag);
 Object.entries(attrs).forEach(([k,v])=>e.setAttribute(k,v));
 parent.appendChild(e);return e;
}
function L(x1,y1,x2,y2,color="#c4d9ff",w=5,parent){
 return S("line",{x1,y1,x2,y2,stroke:color,
 "stroke-width":w,"stroke-linecap":"round"},parent);
}
function C(x,y,r,color="#c4d9ff",parent){
 return S("circle",{cx:x,cy:y,r,fill:"none",
 stroke:color,"stroke-width":3},parent);
}
function T(x,y,s,size=13,parent){
 const e=S("text",{x,y,fill:"#b6cbe6",
 "font-size":size,"text-anchor":"middle"},parent);
 e.textContent=s;return e;
}
function P(d,color="#46e4ad",w=3){
 return S("path",{d,stroke:color,
 "stroke-width":w,fill:"none","stroke-linecap":"round"});
}
function A(x1,y1,x2,y2,color="#46e4ad",parent){
 L(x1,y1,x2,y2,color,4,parent);
 const a=Math.atan2(y2-y1,x2-x1),s=12;
 L(x2,y2,x2-s*Math.cos(a-.5),y2-s*Math.sin(a-.5),color,4,parent);
 L(x2,y2,x2-s*Math.cos(a+.5),y2-s*Math.sin(a+.5),color,4,parent);
}
function clear(){
 if(raf!==null)cancelAnimationFrame(raf);
 raf=null;$("drawing").innerHTML="";
}
function loop(draw){
 const start=performance.now();
 function frame(now){
  const p=((now-start)%3000)/3000;
  let t;
  if(p<.42)t=p/.42;
  else if(p<.57)t=1;
  else if(p<.90)t=1-(p-.57)/.33;
  else t=0;
  t=Math.max(0,Math.min(1,t));
  t=t*t*(3-2*t);
  draw(t);
  raf=requestAnimationFrame(frame);
 }
 raf=requestAnimationFrame(frame);
}
function head(x,y,view="front",scale=1){
 const g=S("g",{transform:`translate(${x} ${y}) scale(${scale})`});
 S("ellipse",{cx:0,cy:0,rx:18,ry:23,fill:"#274565",
 stroke:"#c4d9ff","stroke-width":3},g);
 if(view==="front"){
  C(-7,-3,2,"#c4d9ff",g);C(7,-3,2,"#c4d9ff",g);
  L(0,0,0,8,"#c4d9ff",2,g);
  L(-6,13,6,13,"#c4d9ff",2,g);
  C(-18,3,4,"#c4d9ff",g);C(18,3,4,"#c4d9ff",g);
 }else if(view==="side"){
  S("path",{d:"M-17 -5 L-26 4 L-17 9",
  stroke:"#c4d9ff","stroke-width":2,fill:"none"},g);
  C(9,3,5,"#c4d9ff",g);
  C(-11,-4,2,"#c4d9ff",g);
 }else{
  P("M-14 -9 Q0 -19 14 -9","#c4d9ff",2);
 }
}
function person(){
 head(220,46);
 L(220,70,220,189,"#c4d9ff",9);
 L(220,99,177,145);L(220,99,263,145);
 L(220,189,185,282);L(220,189,255,282);
 C(220,99,5);C(177,145,4);C(263,145,4);
}
function project(v,origin=[220,174],scale=1){
 const [c,l,d]=v;
 return [
 origin[0]+scale*(l*90+d*53),
 origin[1]+scale*(-c*91-d*39)
 ];
}
function vectorDrawing(v,t=1){
 $("drawing").innerHTML="";
 const origin=[220,175];
 const axes=[
  [[1,0,0],"Краниально"],
  [[0,1,0],"Латерально"],
  [[0,0,1],"Дорзально"]
 ];
 axes.forEach(([axis,name])=>{
  const p=project(axis);
  L(...origin,...p,"#5b789b",2);
  const off=name==="Краниально"?-10:13;
  T(p[0],p[1]+off,name,12);
 });
 C(...origin,5);
 const p=project(v);
 A(origin[0],origin[1],
 origin[0]+(p[0]-origin[0])*t,
 origin[1]+(p[1]-origin[1])*t);
 T(220,304,"Пространственная проекция",12);
}
function planeDrawing(kind,t){
 $("drawing").innerHTML="";
 const p=(x,y,z)=>{
  const a=.13*t;
  const X=x*Math.cos(a)-z*Math.sin(a);
  const Z=x*Math.sin(a)+z*Math.cos(a);
  return [220+X*.8+Z*.48,164-y*.83-Z*.36];
 };
 head(220,36,"front",.7);
 L(220,56,220,263,"#c4d9ff",8);
 L(220,105,185,141);L(220,105,255,141);
 L(220,263,190,300);L(220,263,250,300);
 let pts,color;
 if(kind==="sag"){
  pts=[p(0,-115,-75),p(0,-115,75),
  p(0,115,75),p(0,115,-75)];
  color="#38bdf8";
 }else if(kind==="front"){
  pts=[p(-85,-115,0),p(85,-115,0),
  p(85,115,0),p(-85,115,0)];
  color="#46e4ad";
 }else{
  pts=[p(-90,0,-70),p(90,0,-70),
  p(90,0,70),p(-90,0,70)];
  color="#f6b95b";
 }
 S("polygon",{points:pts.map(a=>a.join(",")).join(" "),
 fill:color,"fill-opacity":.27,
 stroke:color,"stroke-width":2});
}
function limbDrawing(v){
 $("drawing").innerHTML="";
 head(100,56);
 L(100,82,100,208,"#c4d9ff",9);
 L(100,110,192,146);
 L(192,146,306,198);
 C(192,146,5);
 if(v==="prox")A(293,192,205,152);
 else A(205,152,293,192);
 T(220,270,"Вдоль верхней конечности");
}
function movementDrawing(q,t){
 $("drawing").innerHTML="";
 if(q.type==="elbow"){
  head(210,48,"side");
  L(210,75,210,170,"#c4d9ff",10);
  C(210,170,6);
  const a=(q.v==="flex"?t:1-t)*1.5;
  const x=210-94*Math.sin(a),y=170+94*Math.cos(a);
  L(210,170,x,y,"#46e4ad",10);
  C(x,y,5,"#46e4ad");
  const start=q.v==="flex"?0:1.5;
  const end=q.v==="flex"?1.5:0;
  const point=a=>[210-65*Math.sin(a),170+65*Math.cos(a)];
  const p1=point(start),p2=point(end);
  const pm=point((start+end)/2);
  P(`M${p1.join(" ")} Q${pm[0]-8} ${pm[1]+7} ${p2.join(" ")}`,
   "#46e4ad",2);
  A(pm[0],pm[1],p2[0],p2[1]);
  T(220,306,"Вид сбоку: локоть");
 }
 if(q.type==="shoulder"){
  head(220,42);
  L(220,68,220,187,"#c4d9ff",9);
  L(220,187,190,272);L(220,187,250,272);
  L(220,98,260,165);
  const a=(q.v==="abduct"?t:1-t)*1.32;
  const x=220-95*Math.sin(a),y=98+95*Math.cos(a);
  L(220,98,x,y,"#46e4ad",10);
  const a1=q.v==="abduct"?0:1.32;
  const a2=q.v==="abduct"?1.32:0;
  const point=a=>[220-73*Math.sin(a),98+73*Math.cos(a)];
  const p1=point(a1),p2=point(a2);
  const pm=point((a1+a2)/2);
  P(`M${p1.join(" ")} Q${pm[0]-8} ${pm[1]+6} ${p2.join(" ")}`);
  A(...pm,...p2);
  T(220,307,"Вид спереди: плечо");
 }
 if(q.type==="forearm"){
  head(220,43);
  L(220,69,220,163,"#c4d9ff",10);
  const a=(q.v==="pronate"?t:1-t)*Math.PI;
  const width=75*Math.cos(a);
  S("ellipse",{cx:220,cy:205,
   rx:Math.max(5,Math.abs(width)),ry:16,
   fill:"#46e4ad","fill-opacity":.35,
   stroke:"#46e4ad","stroke-width":3});
  L(220-width,205,220+width,205,"#46e4ad",5);
  T(220,285,"Условная проекция вращения ладони");
 }
 if(q.type==="foot"){
  L(220,65,220,205,"#c4d9ff",12);
  C(220,205,6);
  const a=(q.v==="invert"?-1:1)*t*26;
  const g=S("g",{transform:`rotate(${a} 220 210)`});
  S("ellipse",{cx:220,cy:239,rx:48,ry:20,
   fill:"#46e4ad","fill-opacity":.35,
   stroke:"#46e4ad","stroke-width":4},g);
  L(220,210,220,239,"#46e4ad",6,g);
  T(220,305,"Условная фронтальная проекция стопы");
 }
}
function draw(q){
 clear();
 if(q.type==="vector"){
  loop(t=>vectorDrawing(q.v,.12+.88*t));
 }else if(q.type==="plane"){
  loop(t=>planeDrawing(q.v,t));
 }else if(q.type==="limb"){
  limbDrawing(q.v);
 }else{
  loop(t=>movementDrawing(q,t));
 }
}

// Миниатюры векторов для обратных вопросов
function miniVector(v){
 const svg=document.createElementNS(NS,"svg");
 svg.setAttribute("viewBox","0 0 190 125");
 svg.setAttribute("aria-label","Вариант направления");
 const origin=[85,80];
 function ln(a,b,color,w=2){
  const e=document.createElementNS(NS,"line");
  e.setAttribute("x1",a[0]);e.setAttribute("y1",a[1]);
  e.setAttribute("x2",b[0]);e.setAttribute("y2",b[1]);
  e.setAttribute("stroke",color);
  e.setAttribute("stroke-width",w);
  e.setAttribute("stroke-linecap","round");
  svg.appendChild(e);
 }
 const proj=x=>project(x,origin,.42);
 [[1,0,0],[0,1,0],[0,0,1]].forEach(a=>
  ln(origin,proj(a),"#6984a4"));
 const end=proj(v);
 ln(origin,end,"#46e4ad",5);
 const a=Math.atan2(end[1]-origin[1],end[0]-origin[0]);
 ln(end,[end[0]-10*Math.cos(a-.5),
  end[1]-10*Math.sin(a-.5)],"#46e4ad",4);
 ln(end,[end[0]-10*Math.cos(a+.5),
  end[1]-10*Math.sin(a+.5)],"#46e4ad",4);
 return svg;
}
function candidates(q){
 const same=Q.filter(x=>x!==q&&x.cat===q.cat);
 return shuffle(same).slice(0,3);
}
function start(){
 clear();
 const cat=$("category").value,level=$("level").value;
 let items=Q.filter(q=>
  (cat==="all"||q.cat===cat)&&
  (level==="all"||q.level===Number(level))
 );
 if(items.length===0){
  $("question").textContent="Для этого сочетания нет заданий.";
  $("answers").innerHTML="";
  $("counter").textContent="0 вопросов";
  $("score").textContent="";
  $("progress").style.width="0%";
  $("visualNote").textContent="";
  $("topic").textContent="";
  $("next").classList.add("hidden");
  $("results").style.display="none";
  return;
 }
 pool=shuffle(items).slice(0,10);
 index=0;score=0;
 $("results").style.display="none";
 show();
}
function show(){
 clear();
 locked=false;
 const q=pool[index];
 const selected=$("mode").value;
 currentMode=selected==="mixed"?
  shuffle(["visual","reverse","text"])[0]:selected;
 // Reverse vector mode is available for vectors.
 if(currentMode==="reverse"&&q.type!=="vector")
  currentMode="visual";
 $("counter").textContent=`Вопрос ${index+1} из ${pool.length}`;
 $("score").textContent=`Правильно: ${score}`;
 $("progress").style.width=(index/pool.length*100)+"%";
 $("topic").textContent={
  directions:"АНАТОМИЧЕСКИЕ НАПРАВЛЕНИЯ",
  advanced:"СОСТАВНЫЕ НАПРАВЛЕНИЯ",
  movements:"ДВИЖЕНИЯ СУСТАВОВ",
  planes:"АНАТОМИЧЕСКИЕ ПЛОСКОСТИ"
 }[q.cat];
 $("answers").innerHTML="";
 $("feedback").innerHTML="";
 $("next").classList.add("hidden");
 $("visualNote").textContent="";

 let options=[];
 let correctAnswer;

 if(currentMode==="reverse"){
  $("question").textContent=
   `Выбери вектор направления «${q.term}»`;
  $("visualTitle").textContent="АНАТОМИЧЕСКАЯ СИСТЕМА КООРДИНАТ";
  vectorDrawing([0,0,0],0);
  $("visualNote").textContent=
   "Оси одинаковы для всех четырёх вариантов";
  const other=shuffle(Q.filter(x=>x.type==="vector"&&
   JSON.stringify(x.v)!==JSON.stringify(q.v)))
   .filter((x,i,a)=>a.findIndex(y=>
    JSON.stringify(y.v)===JSON.stringify(x.v))===i)
   .slice(0,3);
  options=shuffle([q,...other]);
  correctAnswer=q;
 }else if(currentMode==="text"){
  $("question").textContent=
   `Какое определение соответствует термину «${q.term}»?`;
  $("visualTitle").textContent="АНАТОМИЧЕСКАЯ ТЕРМИНОЛОГИЯ";
  $("visualNote").textContent="Выбери правильное определение";
  const other=candidates(q);
  options=shuffle([q,...other]);
  correctAnswer=q;
 }else{
  $("question").textContent=q.type==="plane"?
   "Какая анатомическая плоскость показана?":
   q.type==="elbow"||q.type==="shoulder"||
   q.type==="forearm"||q.type==="foot"?
   "Как называется показанное движение?":
   q.type==="limb"?
   "Как называется направление вдоль конечности?":
   "Назови направление показанного вектора.";
  $("visualTitle").textContent="АНАТОМИЧЕСКАЯ ВИЗУАЛИЗАЦИЯ";
  draw(q);
  const other=candidates(q);
  options=shuffle([q,...other]);
  correctAnswer=q;
 }

 options.forEach(option=>{
  const b=document.createElement("button");
  if(currentMode==="reverse"){
   b.className="vectorChoice";
   b.appendChild(miniVector(option.v));
  }else{
   b.textContent=currentMode==="text"?option.ex:option.term;
  }
  b.onclick=()=>answer(b,option,correctAnswer);
  $("answers").appendChild(b);
 });
}
function answer(button,chosen,right){
 if(locked)return;
 locked=true;
 const ok=chosen===right;
 if(ok)score++;
 stats.done++;
 if(ok)stats.correct++;
 try{
  localStorage.setItem("anatomyStats13",JSON.stringify(stats));
 }catch(e){}
 const buttons=[...$("answers").querySelectorAll("button")];
 buttons.forEach((b,i)=>{
  b.disabled=true;
  if(b===button&&!ok)b.classList.add("wrong");
  if(b===button&&ok)b.classList.add("correct");
  if(!ok&&i>=0){
   // Correct option is located by its stored object.
   if(b.dataset.answer===right.term)b.classList.add("correct");
  }
 });
 $("feedback").innerHTML="";
 const h=document.createElement("strong");
 h.textContent=ok?"✓ Правильно!":"✗ Неправильно";
 const p=document.createElement("p");
 p.textContent=`${right.term}. ${right.ex}`;
 $("feedback").append(h,p);
 $("score").textContent=`Правильно: ${score}`;
 $("next").textContent=index===pool.length-1?
  "Завершить тренировку":"Следующий вопрос →";
 $("next").classList.remove("hidden");
}
function next(){
 index++;
 if(index<pool.length){show();return}
 clear();
 $("progress").style.width="100%";
 $("results").style.display="block";
 $("results").innerHTML="";
 const h=document.createElement("h2");
 h.textContent="Тренировка завершена";
 const p=document.createElement("p");
 p.textContent=`Правильных ответов: ${score} из ${pool.length}`;
 const total=document.createElement("p");
 total.textContent=`Всего в версии 1.3: ${stats.correct} из ${stats.done}`;
 const b=document.createElement("button");
 b.textContent="Новая тренировка";
 b.onclick=start;
 $("results").append(h,p,total,b);
 $("answers").innerHTML="";
 $("feedback").innerHTML="";
 $("question").textContent="Готово!";
 $("visualNote").textContent="";
 $("next").classList.add("hidden");
}
["category","level","mode"].forEach(id=>
 $(id).addEventListener("change",start));
$("restart").addEventListener("click",start);
$("next").addEventListener("click",next);
start();
</script>


<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Anatomy Trainer 1.1</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b1425;color:#eaf2ff;font-family:Arial,sans-serif}
main{max-width:950px;margin:auto;padding:18px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px}
h1{font-size:25px;margin:8px 0}
small{color:#9eb4d3}
.card{background:#152640;border:1px solid #345078;border-radius:18px;padding:20px;margin-top:18px}
.bar{height:9px;background:#354763;border-radius:10px;overflow:hidden;margin:15px 0}
#progress{height:100%;background:#39c5e8;width:0;transition:.3s}
.top{display:flex;justify-content:space-between;gap:10px;color:#bcd1ea}
.stage{background:#0c1a30;border-radius:14px;margin:15px 0;padding:10px;text-align:center}
svg{width:100%;max-width:460px;height:300px;display:block;margin:auto}
button,select{background:#263f64;border:1px solid #5877a3;color:white;border-radius:10px;padding:13px;font-size:15px;cursor:pointer}
button:hover{background:#365a89}
button:disabled{opacity:.55;cursor:default}
.controls{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:12px 0}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:15px}
.answers button{text-align:left;min-height:55px}
.correct{background:#176b50!important;border-color:#4ade80!important}
.wrong{background:#843944!important;border-color:#ff8181!important}
#feedback{margin-top:15px;line-height:1.6}
#next{background:#167ca5;margin-top:15px;width:100%}
.hidden{display:none!important}
.note{font-size:13px;color:#a5bad4;line-height:1.5}
#question{font-size:21px;line-height:1.4}
#visualTitle{font-size:13px;color:#a8c2df}
#visualNote{font-size:13px;color:#a8c2df;min-height:32px}
@media(max-width:500px){
.answers{grid-template-columns:1fr}
svg{height:250px}
.card{padding:13px}
h1{font-size:21px}
}
</style>
</head>
<body>
<main>
<header>
<div>
<h1>🦴 Anatomy Trainer <small>1.1</small></h1>
<small>Анатомические направления и движения суставов</small>
</div>
<button onclick="restart()">↻</button>
</header>

<div class="card">
<div class="controls">
<select id="category" onchange="restart()">
<option value="all">Все категории</option>
<option value="directions">Направления</option>
<option value="movements">Движения суставов</option>
<option value="planes">Плоскости</option>
</select>
<select id="mode" onchange="restart()">
<option value="visual">Угадай по изображению</option>
<option value="text">Вопросы по определениям</option>
</select>
</div>
<div class="top">
<span id="counter"></span>
<span id="score"></span>
</div>
<div class="bar"><div id="progress"></div></div>

<div class="stage">
<div id="visualTitle">АНАТОМИЧЕСКАЯ ВИЗУАЛИЗАЦИЯ</div>
<svg id="drawing" viewBox="0 0 400 300" aria-label="Анатомическая схема"></svg>
<div id="visualNote"></div>
<div class="controls">
<button onclick="replay()">▶ Повторить движение</button>
</div>
</div>

<small id="topic"></small>
<h2 id="question"></h2>
<div id="answers" class="answers"></div>
<div id="feedback"></div>
<button id="next" class="hidden" onclick="nextQuestion()">Следующий вопрос →</button>
</div>

<div class="card" id="results" style="display:none"></div>
<p class="note">
Учебные схемы условные. Анимации показывают
основной принцип движения, а не полную
трёхмерную кинематику суставов.
Прогресс сохраняется в этом браузере.
</p>
</main>

<script>
const NS="http://www.w3.org/2000/svg";
const $=id=>document.getElementById(id);

const questions=[
{cat:"directions",term:"Краниально",type:"arrow",v:"up",
q:"В каком анатомическом направлении указывает стрелка?",
opts:["Каудально","Краниально","Латерально","Дорзально"],
ex:"Краниально: в направлении головы."},
{cat:"directions",term:"Каудально",type:"arrow",v:"down",
q:"В каком направлении указывает стрелка?",
opts:["Краниально","Медиально","Каудально","Вентрально"],
ex:"Каудально: в направлении нижнего конца туловища."},
{cat:"directions",term:"Латерально",type:"arrow",v:"right",
q:"Как называется направление от срединной линии тела?",
opts:["Медиально","Латерально","Проксимально","Каудально"],
ex:"Латерально: дальше от срединной плоскости."},
{cat:"directions",term:"Медиально",type:"arrow",v:"left",
q:"Как называется направление к срединной линии тела?",
opts:["Латерально","Дистально","Медиально","Дорзально"],
ex:"Медиально: ближе к срединной плоскости."},
{cat:"directions",term:"Проксимально",type:"limb",v:"prox",
q:"Стрелка вдоль руки направлена к плечу. Как называется направление?",
opts:["Дистально","Каудально","Проксимально","Латерально"],
ex:"Проксимально: ближе к месту соединения конечности с туловищем."},
{cat:"directions",term:"Дистально",type:"limb",v:"dist",
q:"Стрелка вдоль руки направлена к кисти. Как называется направление?",
opts:["Проксимально","Дистально","Медиально","Вентрально"],
ex:"Дистально: дальше от места соединения конечности с туловищем."},
{cat:"directions",term:"Вентрально",type:"side",v:"front",
q:"Стрелка направлена к передней поверхности туловища. Как называется направление?",
opts:["Дорзально","Вентрально","Каудально","Медиально"],
ex:"Вентрально: к передней стороне туловища человека."},
{cat:"directions",term:"Дорзально",type:"side",v:"back",
q:"Стрелка направлена к задней поверхности туловища. Как называется направление?",
opts:["Вентрально","Краниально","Дорзально","Дистально"],
ex:"Дорзально: к задней стороне туловища."},

{cat:"movements",term:"Флексия",type:"elbow",v:"flex",
q:"Как называется показанное движение предплечья в локтевом суставе?",
opts:["Экстензия","Флексия","Пронация","Абдукция"],
ex:"Флексия: сгибание локтя, уменьшение угла между плечом и предплечьем."},
{cat:"movements",term:"Экстензия",type:"elbow",v:"extend",
q:"Как называется показанное движение в локтевом суставе?",
opts:["Флексия","Супинация","Экстензия","Аддукция"],
ex:"Экстензия: разгибание локтя."},
{cat:"movements",term:"Абдукция",type:"shoulder",v:"abduct",
q:"Рука отводится в сторону от туловища. Назови движение.",
opts:["Аддукция","Абдукция","Флексия","Пронация"],
ex:"Абдукция: отведение плеча в данном случае во фронтальной плоскости."},
{cat:"movements",term:"Аддукция",type:"shoulder",v:"adduct",
q:"Рука возвращается из отведения к туловищу. Назови движение.",
opts:["Абдукция","Экстензия","Аддукция","Супинация"],
ex:"Аддукция: приведение плеча к туловищу."},
{cat:"movements",term:"Пронация",type:"forearm",v:"pronate",
q:"Предплечье поворачивается так, что ладонь из положения вверх обращается вниз. Назови движение.",
opts:["Супинация","Пронация","Абдукция","Инверсия"],
ex:"Пронация: вращение предплечья, при котором ладонь из положения вверх поворачивается вниз."},
{cat:"movements",term:"Супинация",type:"forearm",v:"supinate",
q:"Предплечье поворачивается из положения ладонью вниз в положение ладонью вверх.",
opts:["Пронация","Флексия","Супинация","Эверсия"],
ex:"Супинация: противоположное пронации вращение предплечья."},
{cat:"movements",term:"Инверсия",type:"foot",v:"invert",
q:"Подошва стопы поворачивается преимущественно медиально. Назови движение.",
opts:["Эверсия","Инверсия","Дорсифлексия","Абдукция"],
ex:"Инверсия: обращение подошвенной поверхности преимущественно медиально."},
{cat:"movements",term:"Эверсия",type:"foot",v:"evert",
q:"Подошва стопы поворачивается преимущественно латерально. Назови движение.",
opts:["Инверсия","Флексия","Эверсия","Супинация"],
ex:"Эверсия: обращение подошвенной поверхности преимущественно латерально."},

{cat:"planes",term:"Сагиттальная",type:"plane",v:"sag",
q:"Какая анатомическая плоскость показана?",
opts:["Фронтальная","Сагиттальная","Поперечная","Горизонтальная ось"],
ex:"Сагиттальные плоскости разделяют тело на правую и левую части."},
{cat:"planes",term:"Фронтальная",type:"plane",v:"front",
q:"Какая плоскость показана?",
opts:["Сагиттальная","Поперечная","Фронтальная","Продольная ось"],
ex:"Фронтальная плоскость разделяет тело на переднюю и заднюю части."},
{cat:"planes",term:"Поперечная",type:"plane",v:"trans",
q:"Какая плоскость показана?",
opts:["Поперечная","Фронтальная","Сагиттальная","Вертикальная ось"],
ex:"Поперечная плоскость разделяет тело на верхнюю и нижнюю части."}
];

let pool=[],index=0,correct=0,locked=false;
let animation=null;
let stats=JSON.parse(localStorage.getItem("anatomyStats11")||'{"done":0,"correct":0}');

function svgEl(tag,attrs={},parent=$("drawing")){
let e=document.createElementNS(NS,tag);
for(let [k,v] of Object.entries(attrs))e.setAttribute(k,v);
parent.appendChild(e);return e;
}
function line(x1,y1,x2,y2,color="#c4d9ff",w=7){
return svgEl("line",{x1,y1,x2,y2,stroke:color,"stroke-width":w,"stroke-linecap":"round"});
}
function circle(x,y,r,color="#c4d9ff"){
return svgEl("circle",{cx:x,cy:y,r,fill:"none",stroke:color,"stroke-width":5});
}
function label(x,y,t){
let e=svgEl("text",{x,y,fill:"#a9c4e8","font-size":14,"text-anchor":"middle"});
e.textContent=t;return e;
}
function arrow(x1,y1,x2,y2){
line(x1,y1,x2,y2,"#46e4ad",6);
let a=Math.atan2(y2-y1,x2-x1),s=16;
line(x2,y2,x2-s*Math.cos(a-.55),y2-s*Math.sin(a-.55),"#46e4ad",6);
line(x2,y2,x2-s*Math.cos(a+.55),y2-s*Math.sin(a+.55),"#46e4ad",6);
}
function person(){
circle(170,43,19);
line(170,65,170,165);
line(170,85,130,125);
line(170,85,210,125);
line(170,165,140,238);
line(170,165,200,238);
}
function clear(){
if(animation)cancelAnimationFrame(animation);
animation=null;
$("drawing").innerHTML="";
}
function oscillate(draw){
let start=performance.now();
function frame(now){
let phase=(now-start)%2600/2600;
let t=(1-Math.cos(phase*2*Math.PI))/2;
draw(t);
animation=requestAnimationFrame(frame);
}
animation=requestAnimationFrame(frame);
}
function drawStatic(q){
clear();
if(q.type==="arrow"){
person();
let coords={
up:[260,205,260,85],
down:[260,85,260,205],
right:[170,145,290,145],
left:[290,145,170,145]
};
arrow(...coords[q.v]);
label(200,280,"Вид спереди");
}
if(q.type==="limb"){
circle(110,85,20);
line(110,105,110,200);
line(110,125,205,150);
line(205,150,300,195);
arrow(q.v==="prox"?290:205,q.v==="prox"?191:154,
q.v==="prox"?212:290,q.v==="prox"?154:191);
label(200,255,"Плечо → предплечье → кисть");
}
if(q.type==="side"){
circle(170,48,22);
line(170,70,170,225,"#c4d9ff",18);
label(170,275,"Вид сбоку: лицо слева");
line(150,48,134,55,"#c4d9ff",5);
if(q.v==="front")arrow(260,150,100,150);
else arrow(100,150,260,150);
}
if(q.type==="plane"){
person();
let p=q.v;
if(p==="sag"){
svgEl("polygon",{points:"155,25 210,5 210,245 155,260",fill:"#39b8f0","fill-opacity":".35",stroke:"#39b8f0"});
}
if(p==="front"){
svgEl("rect",{x:115,y:20,width:110,height:235,fill:"#46e4ad","fill-opacity":".24",stroke:"#46e4ad"});
}
if(p==="trans"){
svgEl("polygon",{points:"90,145 240,145 285,175 135,175",fill:"#f6b95b","fill-opacity":".5",stroke:"#f6b95b"});
}
label(200,285,"Условная схема плоскости");
}
}
function drawMoving(q,t){
$("drawing").innerHTML="";
if(q.type==="elbow"){
let sx=165,sy=75,ex=165,ey=160,L=95;
circle(165,45,19);
line(sx,sy,ex,ey);
circle(ex,ey,5);
let flex=q.v==="flex"?t:1-t;
let a=Math.PI/2+flex*Math.PI*.68;
let hx=ex+L*Math.cos(a),hy=ey+L*Math.sin(a);
line(ex,ey,hx,hy,"#46e4ad",9);
circle(hx,hy,5);
label(200,280,"Вид сбоку: движение локтя");
}
if(q.type==="shoulder"){
circle(200,42,18);
line(200,63,200,190);
line(200,190,165,260);
line(200,190,235,260);
line(200,90,240,145);
let a=(q.v==="abduct"?t:1-t)*1.35;
let x=200-90*Math.sin(a);
let y=90+90*Math.cos(a);
line(200,90,x,y,"#46e4ad",9);
label(200,287,"Вид спереди: левое плечо модели");
}
if(q.type==="forearm"){
circle(200,65,9);
line(200,74,200,180,"#c4d9ff",12);
let a=(q.v==="pronate"?t:1-t)*Math.PI;
let w=65*Math.cos(a);
svgEl("ellipse",{cx:200,cy:205,rx:Math.max(5,Math.abs(w)),ry:16,
fill:"#46e4ad","fill-opacity":".65"});
line(200-w,205,200+w,205,"#46e4ad",5);
label(200,260,"Условная проекция вращения ладони");
}
if(q.type==="foot"){
line(200,50,200,165,"#c4d9ff",14);
let a=(q.v==="invert"?-1:1)*t*.5;
let g=svgEl("g",{transform:`rotate(${a*180/Math.PI} 200 175)`});
svgEl("ellipse",{cx:200,cy:203,rx:50,ry:24,fill:"#46e4ad","fill-opacity":".55",stroke:"#46e4ad","stroke-width":4},g);
label(200,275,"Условная схема поворота стопы");
}
}
function replay(){
let q=pool[index];
if(!q)return;
clear();
$("visualNote").textContent=q.type==="elbow"||q.type==="shoulder"?
"Наблюдай движение зелёного сегмента":
q.type==="forearm"||q.type==="foot"?
"Упрощённая анимация, не точная 3D-кинематика":
"Определи направление или плоскость";
if(["elbow","shoulder","forearm","foot"].includes(q.type)){
oscillate(t=>drawMoving(q,t));
}else drawStatic(q);
}
function shuffle(a){
return [...a].sort(()=>Math.random()-.5);
}
function restart(){
clear();
pool=shuffle(questions.filter(q=>$("category").value==="all"||q.cat===$("category").value)).slice(0,10);
index=0;correct=0;
$("results").style.display="none";
showQuestion();
}
function showQuestion(){
locked=false;
let q=pool[index];
$("counter").textContent=`Вопрос ${index+1} из ${pool.length}`;
$("score").textContent=`Правильно: ${correct}`;
$("progress").style.width=(index/pool.length*100)+"%";
$("topic").textContent={directions:"АНАТОМИЧЕСКИЕ НАПРАВЛЕНИЯ",movements:"ДВИЖЕНИЯ СУСТАВОВ",planes:"АНАТОМИЧЕСКИЕ ПЛОСКОСТИ"}[q.cat];
$("question").textContent=$("mode").value==="visual"?q.q:
`Какое определение соответствует термину «${q.term}»?`;
$("feedback").textContent="";
$("next").classList.add("hidden");
$("answers").innerHTML="";
let options=$("mode").value==="visual"?
shuffle(q.opts):
shuffle([q.ex,...shuffle(questions.filter(x=>x!==q&&x.cat===q.cat).map(x=>x.ex)).slice(0,3)]);
options.forEach(value=>{
let b=document.createElement("button");
b.textContent=value;
b.onclick=()=>answer(b,value,$("mode").value==="visual"?q.term:q.ex);
$("answers").appendChild(b);
});
replay();
}
function answer(button,value,right){
if(locked)return;
locked=true;
let ok=value===right;
if(ok)correct++;
stats.done++;
if(ok)stats.correct++;
localStorage.setItem("anatomyStats11",JSON.stringify(stats));
document.querySelectorAll("#answers button").forEach(b=>{
b.disabled=true;
if(b.textContent===right)b.classList.add("correct");
});
if(!ok)button.classList.add("wrong");
$("feedback").innerHTML=
`<strong>${ok?"✓ Правильно!":"✗ Неправильно"}</strong><p>${pool[index].ex}</p>`;
$("score").textContent=`Правильно: ${correct}`;
$("next").textContent=index===pool.length-1?"Завершить тренировку":"Следующий вопрос →";
$("next").classList.remove("hidden");
}
function nextQuestion(){
index++;
if(index>=pool.length){
clear();
$("progress").style.width="100%";
$("results").style.display="block";
$("results").innerHTML=`<h2>Тренировка завершена</h2>
<p>Результат: ${correct} из ${pool.length}</p>
<p>За всё время: ${stats.correct} правильных из ${stats.done}</p>
<button onclick="restart()">Новая тренировка</button>`;
$("next").classList.add("hidden");
$("answers").innerHTML="";
$("question").textContent="Готово!";
$("visualNote").textContent="";
$("drawing").innerHTML="";
return;
}
showQuestion();
}
restart();
</script>
</body>
</html>
